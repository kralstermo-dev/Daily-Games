<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colorfle | Daily Games</title>
<link rel="stylesheet" href="../../../styles/main.css?v=5">
</head>
<body>

<div class="wrap">
  <a class="back-link" href="../../index.html">&larr; back to the shelf</a>
</div>

<div class="game-shell">
  <div class="game-header">
    <h1>Colorfle</h1>
    <p>Guess the hex code of this color in 6 tries.</p>
  </div>

  <div id="status" class="status-msg" role="status" aria-live="polite"></div>

  <div id="swatch" class="cf-main-swatch"></div>
  <div id="swatch-hex" class="cf-main-hex">?  ?  ?  ?  ?  ?</div>
  <div id="attempts-left" class="attempts-left"></div>

  <form id="guess-form" class="guess-form">
    <div class="autocomplete">
      <input
        id="guess-input"
        type="text"
        placeholder="e.g. 3fae02"
        maxlength="7"
        autocomplete="off"
        required>
    </div>
    <button type="submit">Guess</button>
  </form>

  <button id="play-again" type="button" class="play-again">Play a random color</button>

  <div id="guess-list" class="guess-list"></div>
</div>

<script src="game.js?v=5"></script>
</body>
</html>
