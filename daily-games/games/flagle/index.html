<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flagle | Daily Games</title>
<link rel="stylesheet" href="../../../styles/main.css?v=7">
</head>
<body>

<div class="wrap">
  <a class="back-link" href="../../index.html">&larr; back to the shelf</a>
</div>

<div class="game-shell">
  <div class="game-header game-header-row">
    <h1>Flagle</h1>
    <button id="settings-btn" type="button" class="icon-btn" aria-haspopup="true" aria-expanded="false" title="Settings">⚙</button>
  </div>
  <p id="mode-desc">Guess the country from a zoomed-in flag. It zooms out each guess.</p>

  <div id="settings-panel" class="settings-panel hidden">
    <label class="settings-row">
      <input type="checkbox" id="show-flags-toggle" checked>
      Show flags in the country list
    </label>
  </div>

  <div class="mode-select" id="mode-select" role="tablist" aria-label="Flagle mode"></div>

  <div id="win-badge" class="win-badge hidden">Nice one!</div>

  <div class="flag-viewport" id="flag-viewport">
    <img id="flag-img" src="" alt="Mystery flag, zoomed in">
  </div>
  <div id="attempts-left" class="attempts-left"></div>

  <div id="status" class="status-msg" role="status" aria-live="polite"></div>

  <form id="guess-form" class="guess-form" autocomplete="off">
    <div class="autocomplete">
      <input
        id="guess-input"
        type="text"
        placeholder="Choose a country"
        autocomplete="off"
        required>
      <div id="autocomplete-list" class="autocomplete-list hidden"></div>
    </div>
    <button type="submit">Guess</button>
    <button id="play-again" type="button" class="play-again">Play random</button>
  </form>

  <div id="guess-list" class="guess-list"></div>
</div>

<script src="countries.js?v=7"></script>
<script src="game.js?v=7"></script>
</body>
</html>
