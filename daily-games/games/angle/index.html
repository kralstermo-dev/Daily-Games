<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angle | Daily Games</title>
<link rel="stylesheet" href="../../../styles/main.css?v=8">
</head>
<body>

<div class="wrap">
  <a class="back-link" href="../../index.html">&larr; back to the shelf</a>
</div>

<div class="game-shell">
  <div class="game-header">
    <h1>Angle</h1>
    <p>Guess the angle in degrees. 6 tries.</p>
  </div>

  <div id="status" class="status-msg" role="status" aria-live="polite"></div>

  <div id="angle-diagram" class="angle-diagram"></div>
  <div id="attempts-left" class="attempts-left"></div>

  <form id="guess-form" class="guess-form">
    <div class="autocomplete">
      <input
        id="guess-input"
        type="number"
        min="0"
        max="360"
        placeholder="0-360"
        autocomplete="off"
        required>
    </div>
    <button type="submit">Guess</button>
  </form>

  <button id="play-again" type="button" class="play-again">Play a random angle</button>

  <div id="guess-list" class="guess-list"></div>
</div>

<script src="game.js?v=8"></script>
</body>
</html>
