<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rule34dle | Daily Games</title>
<link rel="stylesheet" href="../../styles/main.css">
</head>
<body>

<div class="wrap">
  <a class="back-link" href="../../index.html">&larr; back to the shelf</a>
</div>

<div class="game-shell r34-shell">
  <div class="game-header">
    <h1>Rule34dle</h1>
    <p>Which character has more posts on Rule 34? Click the one you think is higher.</p>
  </div>

  <div class="r34-stats">
    <span>Streak: <strong id="streak">0</strong></span>
    <span>Best: <strong id="best">0</strong></span>
  </div>

  <div id="status" class="status-msg" role="status" aria-live="polite"></div>

  <div class="r34-pair" id="pair">
    <!-- filled by JS -->
  </div>

  <button id="next-btn" class="play-again">Next pair</button>

  <p class="r34-note">
    Counts are approximate snapshots (not live). No images are shown — names only.
    True live API needs a proxy because of CORS + required API keys.
  </p>
</div>

<script src="characters.js"></script>
<script src="game.js"></script>
</body>
</html>
