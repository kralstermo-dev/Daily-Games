<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nerdle | Daily Games</title>
<link rel="stylesheet" href="../../styles/main.css?v=2">
</head>
<body>

<div class="wrap">
  <a class="back-link" href="../../index.html">&larr; back to the shelf</a>
</div>

<div class="game-shell">
  <div class="game-header">
    <h1>Nerdle</h1>
    <p id="mode-desc">Guess the equation in 6 tries. Every row must be true math.</p>
  </div>

  <div class="mode-select" id="mode-select" role="tablist" aria-label="Nerdle mode"></div>

  <div id="status" class="status-msg" role="status" aria-live="polite"></div>

  <div id="grid" class="grid nerdle-grid"></div>

  <button id="play-again" class="play-again">Play a random equation</button>

  <div id="keyboard" class="keyboard nerdle-keyboard" style="margin-top: 18px;"></div>
</div>

<script src="game.js?v=2"></script>
</body>
</html>
